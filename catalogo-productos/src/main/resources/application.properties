# ===================================================================
# Configuracion de la Aplicacion - Catalogo de Productos
# ===================================================================
spring.application.name=catalogo-productos
server.port=8080

# ===================================================================
# Base de Datos H2 en Memoria
# ===================================================================
spring.datasource.url=jdbc:h2:mem:catalogodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===================================================================
# JPA e Hibernate
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# Consola Web H2 (para exploracion local en /h2-console)
# ===================================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
